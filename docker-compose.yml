version: '3.8'

services:
  # Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: epice-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data
      - ./policy_documents:/app/policy_documents
      - ./api/logs:/app/api/logs
    networks:
      - epice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Service (depends on API so it can resolve host "api")
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time. The browser must be able
        # to reach this URL. Override for prod, e.g.:
        #   NEXT_PUBLIC_API_URL=https://api.yourdomain.com/api docker compose build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: epice-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - epice-network
    restart: unless-stopped

networks:
  epice-network:
    driver: bridge

volumes:
  data:
  policy_documents:
  logs:
